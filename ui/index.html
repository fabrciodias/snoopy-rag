<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snoopy-RAG | Pesquisa Acadêmica</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app" class="app-container">
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="sidebar-header">
                    <div id="logo-btn" class="logo-area" title="Página Inicial">
                        <i data-lucide="microscope" class="icon-brand logo-default"></i>
                        <i data-lucide="panel-left-open" class="icon-brand logo-hover hidden"></i>
                        <h2 class="logo-small">Snoopy-RAG</h2>
                    </div>
                    <button id="btn-sidebar-toggle" class="btn-icon" title="Recolher menu">
                        <i data-lucide="panel-left-close"></i>
                    </button>
                </div>
                <button id="btn-sidebar-new" class="btn-primary-full">
                    <i data-lucide="plus" class="icon-sm"></i> <span>Nova Pesquisa</span>
                </button>
            </div>
            
            <div class="sidebar-middle">
                <div id="auth-section" class="auth-box">
                    <button id="btn-login" class="btn-outline w-full hidden">
                        <i data-lucide="log-in" class="icon-sm"></i> Entrar
                    </button>
                    <div id="folder-container" class="folder-box hidden">
                        <span class="folder-label">Acervo Atual</span>
                        <select id="folder-selector" class="folder-dropdown">
                            <option value="f7faf7d9-ec80-46c6-9572-174865bf1e62">GEPAFOR (Público)</option>
                        </select>
                    </div>
                </div>

                <nav class="sidebar-nav">
                    <div class="nav-title-box" id="btn-nav-folder" title="Gerenciar Acervos">
                        <i data-lucide="folder" class="icon-sm"></i>
                        <h3 class="nav-title">Acervos</h3>
                    </div>

                    <div class="nav-title-box" id="btn-nav-history" title="Histórico Recente">
                        <i data-lucide="history" class="icon-sm"></i>
                        <h3 class="nav-title">Histórico Recente</h3>
                    </div>
                    <div id="history-list"></div>
                </nav>
            </div>

            <div class="sidebar-bottom">
                <button id="btn-theme-toggle" class="btn-icon" style="margin-bottom: 8px; width: 100%; justify-content: flex-start;" title="Alternar Tema">
                    <i data-lucide="moon" class="icon-sm"></i>
                    <span class="nav-title" style="font-size: 0.85rem;">Tema</span>
                </button>
                
                <div id="user-info" class="user-profile hidden" style="display: flex; align-items: center; justify-content: space-between; background-color: var(--bg-app); padding: 8px 12px; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
        
                    <div style="display: flex; align-items: center; gap: 10px; overflow: hidden;">
                        <img id="user-avatar" src="" alt="Avatar" class="avatar-img">
                        <span class="user-name" style="font-size: 0.85rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Usuário</span>
                    </div>

                    <button id="btn-settings" class="btn-icon" title="Configurações">
                        <i data-lucide="settings" style="width: 18px; height: 18px;"></i>
                    </button>
                </div>
            </div>
        </aside>

        <div id="main-content" class="main-area">
            <div id="home-view" class="view active">
                <div class="hero">
                    <h1 class="logo">Snoopy-RAG</h1>
                    <p class="subtitle">Memória Institucional e Recuperação Semântica Documental</p>
                    <form id="search-home" class="search-box">
                        <input type="text" id="input-home" placeholder="Pesquisar" required autocomplete="off">
                        <button type="submit">→</button>
                    </form>
                </div>
            </div>

            <div id="result-view" class="view">
                <header class="topbar">
                    <h2 id="query-title" class="sticky-query"></h2>

                    <button id="btn-new-search" class="btn-icon" title="Iniciar Nova Pesquisa">
                        <i data-lucide="plus-circle"></i>
                    </button>
                </header>

                <main class="layout-grid">
                    <section class="answer-section">
                        <h3 style="font-size: 1.8rem; font-weight: 600; color: var(--text-main); margin-bottom: 20px;">Síntese:</style>

                        <div id="loading-state" class="hidden">
                            <div class="spinner"></div>
                            <p id="live-logs" class="live-logs">Iniciando motor...</p>
                        </div>

                        <div id="answer-box" class="hidden">
                            <div id="answer-text"></div>
                            </div>
                    </section>

                    <aside class="evidence-section">
                        <div class="evidence-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <div>
                                <h3 style="font-size: 1.05rem; font-weight: 600; color: var(--text-main);">Trecho Original</h3>
                                <p id="chunk-abnt" class="evidence-subtitle" style="font-size: 0.82rem; color: var(--text-muted); font-family: monospace;">Aguardando metadados da fonte...</p>
                            </div>
                            <button id="btn-close-evidence" class="btn-icon" title="Fechar painel">
                                <i data-lucide="x"></i>
                            </button>
                        </div>

                        <div id="chunks-container"></div>

                        <div id="sources-section" style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-color);">
                            <h3 style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 10px;">Referências do Acervo</h3>
                            <div id="sources-container"></div>
                        </div>
                    </aside>
                </main>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
